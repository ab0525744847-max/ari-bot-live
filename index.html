<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מסך הבית שלי</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: white;
  background:
    radial-gradient(circle at 20% 20%, #345cff 0, transparent 35%),
    radial-gradient(circle at 80% 75%, #742fff 0, transparent 35%),
    linear-gradient(160deg, #07101f, #15152b);
  background-attachment: fixed;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 35px 18px 120px;
}

.clock {
  text-align: center;
  margin-bottom: 30px;
}

#time {
  font-size: 58px;
  font-weight: bold;
}

#date {
  font-size: 16px;
  opacity: 0.8;
  margin-top: 5px;
}

.search {
  background: white;
  border-radius: 30px;
  padding: 5px 16px;
  display: flex;
  align-items: center;
  margin-bottom: 35px;
}

.search input {
  width: 100%;
  padding: 13px;
  border: none;
  outline: none;
  font-size: 16px;
  background: transparent;
}

.apps {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 25px 12px;
}

.app {
  text-align: center;
  cursor: pointer;
}

.icon {
  width: 65px;
  height: 65px;
  margin: auto;
  border-radius: 20px;
  background: rgba(255,255,255,0.16);
  backdrop-filter: blur(15px);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.25);
}

.app-name {
  margin-top: 7px;
  font-size: 13px;
}

.dock {
  position: fixed;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  width: 92%;
  max-width: 550px;
  padding: 10px;
  border-radius: 30px;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(20px);
  display: flex;
  justify-content: space-around;
}

.dock .icon {
  width: 58px;
  height: 58px;
}
